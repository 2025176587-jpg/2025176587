<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="InternTrack – track internship applications, interviews and offers.">
	<meta name="author" content="IMS566 Student">
	<title>Applications | InternTrack</title>
	<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
	<link href="css/variables.css" rel="stylesheet">
	<link href="css/base.css" rel="stylesheet">
	<link href="css/layout.css" rel="stylesheet">
	<link href="css/components.css" rel="stylesheet">
	<link href="css/pages.css" rel="stylesheet">
	<link href="css/responsive.css" rel="stylesheet">
</head>
<body>
	<header id="nav" class="site-header"></header>
	<main class="page-shell">
		<section class="page-heading" aria-labelledby="pageTitle">
			<h1 id="pageTitle">Applications</h1>
			<p>Search and filter every application you have sent.</p>
		</section>
		<section class="panel" aria-label="Application list and filters">
			<div class="section-heading">
				<div><h2>Your applications</h2><p class="small mb-0">Add and manage your internship applications.</p></div>
				<button id="addApplication" class="btn btn-mark" type="button"><i class="bi bi-plus-lg" aria-hidden="true"></i> Add application</button>
			</div>
			<div class="filters-grid">
				<input id="search" class="form-control" placeholder="Search company or role" aria-label="Search company or role">
				<select id="filter" class="form-select" aria-label="Filter by status">
					<option>All</option><option>Applied</option><option>Interview</option><option>Offer</option><option>Rejected</option>
				</select>
				<select id="companyFilter" class="form-select" aria-label="Filter by company"><option value="All">All companies</option></select>
				<select id="dateFilter" class="form-select" aria-label="Filter by year"><option value="All">All dates</option></select>
				<select id="sort" class="form-select" aria-label="Sort applications">
					<option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="company">Company A to Z</option>
				</select>
			</div>
			<div class="table-responsive">
				<table class="table table-hover align-middle">
					<thead><tr><th scope="col">Company</th><th scope="col">Role</th><th scope="col">City</th><th scope="col">Date</th><th scope="col">Status</th><th scope="col">Actions</th></tr></thead>
					<tbody id="tbody"></tbody>
				</table>
			</div>
			<small id="count" class="text-muted" aria-live="polite"></small>
		</section>
	</main>
	<div class="modal fade" id="applicationModal" tabindex="-1" aria-labelledby="applicationModalTitle" aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content">
				<form id="applicationForm">
					<div class="modal-header">
						<h2 class="modal-title fs-5" id="applicationModalTitle">Application details</h2>
						<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
					</div>
					<div class="modal-body">
						<input id="appId" type="hidden">
						<label class="form-label" for="appCompany">Company</label><input id="appCompany" class="form-control mb-3" required>
						<label class="form-label" for="appRole">Role</label><input id="appRole" class="form-control mb-3" required>
						<label class="form-label" for="appCity">City</label><input id="appCity" class="form-control mb-3" required>
						<label class="form-label" for="appDate">Application date</label><input id="appDate" type="date" class="form-control mb-3" required>
						<label class="form-label" for="appStatus">Status</label>
						<select id="appStatus" class="form-select"><option>Applied</option><option>Interview</option><option>Offer</option><option>Rejected</option></select>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
						<button id="saveApplication" type="submit" class="btn btn-mark">Save changes</button>
					</div>
				</form>
			</div>
		</div>
	</div>
	<div id="footer"></div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
	<script src="js/app.js"></script>
	<script>initApplications()</script>
</body>
</html>
