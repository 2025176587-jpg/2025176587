<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="InternTrack – track internship applications, interviews and offers.">
  <meta name="author" content="IMS566 NurFatihah">
  <title>Log in | InternTrack</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/variables.css" rel="stylesheet">
  <link href="css/base.css" rel="stylesheet">
  <link href="css/layout.css" rel="stylesheet">
  <link href="css/components.css" rel="stylesheet">
  <link href="css/pages.css" rel="stylesheet">
  <link href="css/responsive.css" rel="stylesheet">
</head>
<body class="login-page">
  <header class="login-brand"><a href="index.html"><span class="brand-mark">&#9670;</span> InternTrack</a></header>
  <main class="login-wrap" aria-label="InternTrack account access">
    <section class="login-side" aria-labelledby="welcomeTitle">
      <h1 id="welcomeTitle"><span class="brand-mark">&#9670;</span> InternTrack</h1>
      <p class="lead">Keep every internship application offer in one place.</p>
      <div class="demo-credentials">
        <strong>Demo login</strong><br>
        Username: <code class="text-warning">NurFatihah</code><br>
        Password: <code class="text-warning">ims566</code>
      </div>
    </section>
    <section class="login-form" aria-label="Log in or register">
      <div class="login-form-inner">
        <h2>Welcome back</h2>
        <p class="small mb-0">Sign in to continue your internship search.</p>
        <ul class="nav nav-tabs" role="tablist" aria-label="Account options">
          <li class="nav-item" role="presentation"><button class="nav-link active" id="loginTab" data-bs-toggle="tab" data-bs-target="#tabLogin" type="button" role="tab" aria-controls="tabLogin" aria-selected="true">Log in</button></li>
          <li class="nav-item" role="presentation"><button class="nav-link" id="registerTab" data-bs-toggle="tab" data-bs-target="#tabReg" type="button" role="tab" aria-controls="tabReg" aria-selected="false">Register</button></li>
        </ul>
        <div id="err" class="alert alert-danger d-none" role="alert" aria-live="assertive"></div>
        <div id="ok" class="alert alert-success d-none" role="status" aria-live="polite">Account created. Log in below.</div>
        <div class="tab-content">
          <div class="tab-pane fade show active" id="tabLogin" role="tabpanel" aria-labelledby="loginTab" tabindex="0">
            <form id="loginForm" novalidate>
              <label class="form-label" for="lu">Username</label>
              <input id="lu" class="form-control mb-3" autocomplete="username" required>
              <label class="form-label" for="lp">Password</label>
              <div class="password-wrap mb-4">
                <input id="lp" type="password" class="form-control" autocomplete="current-password" required>
                <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false" data-password-target="lp"><i class="bi bi-eye" aria-hidden="true"></i></button>
              </div>
              <button class="btn btn-mark w-100" type="submit"><i class="bi bi-box-arrow-in-right" aria-hidden="true"></i> Log in</button>
            </form>
          </div>
          <div class="tab-pane fade" id="tabReg" role="tabpanel" aria-labelledby="registerTab" tabindex="0">
            <form id="regForm">
              <label class="form-label" for="rn">Full name</label>
              <input id="rn" class="form-control mb-3" autocomplete="name" required>
              <label class="form-label" for="ru">Username</label>
              <input id="ru" class="form-control mb-3" autocomplete="username" required>
              <label class="form-label" for="rp">Password</label>
              <div class="password-wrap mb-4">
                <input id="rp" type="password" class="form-control" autocomplete="new-password" required>
                <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false" data-password-target="rp"><i class="bi bi-eye" aria-hidden="true"></i></button>
              </div>
              <button class="btn btn-mark w-100" type="submit"><i class="bi bi-person-plus" aria-hidden="true"></i> Create account</button>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>
  <footer class="login-footer">&copy; 2026 InternTrack &ndash; IMS566 Individual Assignment</footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="js/app.js"></script>
  <script>initLogin()</script>
</body>
</html>
