<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="InternTrack – track internship applications, interviews and offers.">
	<meta name="author" content="IMS566 Student">
	<title>Companies | InternTrack</title>
	<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
	<link href="css/variables.css" rel="stylesheet">
	<link href="css/base.css" rel="stylesheet">
	<link href="css/layout.css" rel="stylesheet">
	<link href="css/components.css" rel="stylesheet">
	<link href="css/pages.css" rel="stylesheet">
	<link href="css/responsive.css" rel="stylesheet">
</head>
<body>
	<header id="nav" class="site-header"></header>
	<main class="page-shell">
		<section class="page-heading" aria-labelledby="pageTitle">
			<h1 id="pageTitle">Companies</h1>
			<p>Partner companies with open internships.</p>
		</section>
		<section class="panel company-filter-panel" aria-label="Search and filter companies">
			<div class="filters-grid">
				<input id="companySearch" class="form-control" placeholder="Search companies or locations" aria-label="Search companies or locations">
				<select id="industryFilter" class="form-select" aria-label="Filter by industry"><option value="All">All industries</option></select>
			</div>
		</section>
		<section class="company-grid" id="grid" aria-label="Partner companies"></section>
		<section class="panel allowance-panel">
			<div class="section-heading"><h2>Monthly allowance by company</h2></div>
			<div class="chart-wrap"><canvas id="allowChart" aria-label="Bar chart of monthly allowance by company"></canvas></div>
		</section>
	</main>
	<div id="footer"></div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
	<script src="js/app.js"></script>
	<script>initCompanies()</script>
</body>
</html>
